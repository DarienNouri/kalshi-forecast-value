name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked --dev --python 3.13
      - name: Check research code and tests
        run: make check
      - name: Verify portable portfolio evidence
        run: uv run --locked python scripts/verify_portfolio.py
      - name: Build distribution
        run: uv build
